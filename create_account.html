<!DOCTYPE html>
<html>
<head>

<title>Create Account | Solene</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#ffffff,#ffe0ec);
padding:20px;
overflow:hidden;
}

.container{
text-align:center;
width:100%;
max-width:440px;
padding:45px 35px;
background:white;
border-radius:28px;
box-shadow:0px 18px 40px rgba(0,0,0,0.08);
animation:fadeIn 0.7s ease;
position:relative;
z-index:1;
}

.welcome{
font-size:18px;
letter-spacing:3px;
color:#888;
margin-bottom:6px;
font-weight:500;
}

.logo{
font-family:'Great Vibes', cursive;
font-size:70px;
color:#ff4da6;
margin-bottom:30px;
}

.error{
background:#ffe6e6;
color:#d60000;
padding:12px;
border-radius:12px;
font-size:14px;
margin-bottom:18px;
}

.input-box{
margin-bottom:16px;
}

input{
width:100%;
padding:15px 16px;
border-radius:15px;
border:2px solid #e8e8e8;
font-size:15px;
transition:0.3s;
outline:none;
}

input:focus{
border-color:#ff4da6;
box-shadow:0px 0px 12px rgba(255,77,166,0.18);
}

button{
width:100%;
margin-top:10px;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:500;
color:white;
background:linear-gradient(90deg,#f8b6c8,#ff4da6);
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0px 8px 18px rgba(255,77,166,0.3);
}

.back{
display:inline-block;
margin-top:20px;
font-size:15px;
color:#ff4da6;
text-decoration:none;
font-weight:500;
}

.back:hover{
text-decoration:underline;
}

.forgot{
display:block;
margin-top:18px;
font-size:14px;
color:#777;
cursor:pointer;
transition:0.3s;
}

.forgot:hover{
color:#ff4da6;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:420px;
padding:35px;
border-radius:24px;
animation:fadeIn 0.4s ease;
text-align:center;
}

.modal-title{
font-size:24px;
font-weight:600;
color:#ff4da6;
margin-bottom:10px;
}

.modal-sub{
font-size:14px;
color:#777;
margin-bottom:25px;
line-height:1.7;
}

.close-btn{
margin-top:15px;
background:#fff0f6;
color:#ff4da6;
}

.success{
margin-top:18px;
font-size:14px;
color:#2e9d55;
line-height:1.7;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:600px){

.container{
padding:35px 24px;
}

.logo{
font-size:58px;
}

.modal-content{
padding:28px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="welcome">
CREATE ACCOUNT
</div>

<div class="logo">
Solene
</div>

{% if error %}

<div class="error">
{{ error }}
</div>

{% endif %}

<form action="/signup" method="post">

<div class="input-box">

<input
name="contact"
placeholder="Phone number or Email"
required
autocomplete="off"
>

</div>

<div class="input-box">

<input
type="password"
name="password"
placeholder="New Password"
required
autocomplete="off"
>

</div>

<div class="input-box">

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required
autocomplete="off"
>

</div>

<button type="submit">
Create Account
</button>

</form>

<div class="forgot"
onclick="openModal()">
Forgot Password?
</div>

<a class="back" href="/">
Back to Login
</a>

</div>

<div class="modal" id="forgotModal">

<div class="modal-content">

<div class="modal-title">
Reset Password
</div>

<div class="modal-sub">

Enter your registered email or phone number.
An OTP will be generated for password reset 🌸

</div>

<form action="/forgot-password" method="post">

<div class="input-box">

<input
name="contact"
placeholder="Email or Phone Number"
required
autocomplete="off"
>

</div>

<div class="input-box">

<input
name="otp"
placeholder="Enter OTP"
required
autocomplete="off"
>

</div>

<div class="input-box">

<input
type="password"
name="new_password"
placeholder="New Password"
required
autocomplete="off"
>

</div>

<div class="input-box">

<input
type="password"
name="confirm_new_password"
placeholder="Confirm New Password"
required
autocomplete="off"
>

</div>

<button type="submit">
Reset Password
</button>

</form>

<button class="close-btn" onclick="closeModal()">
Close
</button>

<div class="success">

Demo OTP will appear in terminal 🌿

</div>

</div>

</div>

<script>

function openModal(){

document.getElementById("forgotModal").style.display = "flex"

}

function closeModal(){

document.getElementById("forgotModal").style.display = "none"

}

window.onclick = function(event){

let modal = document.getElementById("forgotModal")

if(event.target == modal){

modal.style.display = "none"

}

}

</script>

</body>

</html>
